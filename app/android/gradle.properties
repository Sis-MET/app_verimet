org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_secure_storage 11 obliga a compilar contra la API 37, pero el AGP que
# trae la plantilla de Flutter 3.44 (9.0.1) solo fue probado hasta la 36.1 y
# avisa en cada build. El build funciona; esto silencia el aviso.
# QUITAR esta linea al subir el AGP a una version probada con la API 37
# (settings.gradle.kts -> com.android.application).
android.suppressUnsupportedCompileSdk=37.0
