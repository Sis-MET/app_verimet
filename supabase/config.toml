project_id = "ivmet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["ivmet://auth/callback"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
# Los registros públicos siguen cerrados: `ivmet-signup` crea la cuenta y el
# código de 6 dígitos que llega en la plantilla de Magic Link la confirma.
otp_length = 6
otp_expiry = 900
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Tu código de IvMET"
content_path = "./supabase/templates/codigo-ivmet.html"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.ivmet-login]
verify_jwt = false

[functions.ivmet-change-password]
# El handler valida con Auth.getUser(token), también con claves asimétricas.
verify_jwt = false

[functions.ivmet-signup]
# Público: el código enviado al correo es lo que autoriza el alta.
verify_jwt = false

[functions.ivmet-password-reset]
verify_jwt = false

[functions.ivmet-team-account]
# El handler valida con Auth.getUser(token), como ivmet-change-password.
verify_jwt = false
